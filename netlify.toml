# Netlify configuration — security headers.
#
# Build settings are intentionally NOT specified here so the existing Netlify UI
# configuration (and the Next.js runtime's auto-detection) keeps working. This
# file only adds response headers, which Netlify merges on top of its defaults.

[[headers]]
  for = "/*"

  [headers.values]
    # ── Clickjacking ────────────────────────────────────────────────────────
    # Without this, anyone can frame m3plus.org and overlay the contact /
    # newsletter forms to harvest submissions. This is the one realistic
    # attack against a static marketing site, so it is enforced immediately.
    X-Frame-Options = "DENY"

    # ── MIME sniffing ───────────────────────────────────────────────────────
    X-Content-Type-Options = "nosniff"

    # ── Referrer leakage ────────────────────────────────────────────────────
    # Stops full URLs leaking to lu.ma, Google, Formspree, LinkedIn and Slack.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # ── Feature delegation ──────────────────────────────────────────────────
    # Nothing on this site uses these. Denying them at the document level also
    # constrains what the embedded Luma / Google Slides iframes can request.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

    # ── Transport security ──────────────────────────────────────────────────
    # 1 year. Add `preload` only once you are certain every subdomain is HTTPS.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # ── Content Security Policy ─────────────────────────────────────────────
    # Enforced. Shipped Report-Only first; a console check on the live site
    # returned zero CSP violations — the only console output was third-party
    # cookie rejections from Luma/Cloudflare, which are the browser's own
    # privacy behaviour and unrelated to this policy. The Luma iframe was
    # confirmed to be loading (its Cloudflare and session cookies were being
    # set), so `frame-src` was admitting it correctly.
    #
    # To roll back: rename this key to `Content-Security-Policy-Report-Only`
    # and push. That reverts to reporting without blocking.
    #
    # Notes on the directives:
    #   script-src 'unsafe-inline'  Next.js App Router injects inline hydration
    #                               bootstrap scripts and does not use nonces here.
    #   style-src  'unsafe-inline'  Tailwind + Next.js inject inline <style>.
    #   font-src   'self'           Manrope is self-hosted via next/font.
    #   connect-src formspree.io    All three forms POST there via fetch().
    #   frame-src  *.lu.ma/*.luma.com
    #                               The calendar loads from luma.com today. A CSP
    #                               wildcard does NOT cover the bare domain, so
    #                               both forms are listed: the bare hosts for what
    #                               ships now, the wildcards so the calendar keeps
    #                               working if Luma ever moves the embed to a
    #                               subdomain. Still only Luma either way.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; frame-src https://lu.ma https://*.lu.ma https://luma.com https://*.luma.com https://docs.google.com; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

# Hashed build assets are immutable — cache them hard.
[[headers]]
  for = "/_next/static/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
